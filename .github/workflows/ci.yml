name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读权限：PR 来自 fork 时也拿不到写权限，避免任何“提个 PR 就能改仓库”的可能
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: syntax & sanity
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: JS 语法（node --check）
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path src, lib -Recurse -Filter *.js -File)
          if ($files.Count -eq 0) { throw "没有找到任何 JS 文件，检查范围可能写错了" }
          foreach ($f in $files) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "语法错误：$($f.FullName)" }
          }
          "checked $($files.Count) js file(s)"

      - name: Python 语法（ast 解析）
        shell: pwsh
        run: |
          # 不要用 py_compile：它会写 __pycache__/*.pyc，而下面的"打包垃圾门"正是要拒绝这些文件，
          # 于是检查步骤自己把后面的门踩响（这条 CI 曾因此一直红）。ast.parse 只解析、不落盘。
          $files = @(Get-ChildItem -Path engine, scripts -Recurse -Filter *.py -File)
          if ($files.Count -eq 0) { throw "没有找到任何 Python 文件" }
          $code = @'
import ast, sys, pathlib
for p in sys.argv[1:]:
    ast.parse(pathlib.Path(p).read_text(encoding="utf-8"), p)
print("checked %d py file(s)" % (len(sys.argv) - 1))
'@
          python -c $code @($files.FullName)
          if ($LASTEXITCODE -ne 0) { throw "Python 语法错误" }
          $leftover = @(Get-ChildItem -Path engine, scripts -Recurse -Force -Include *.pyc,*.pyo -ErrorAction SilentlyContinue)
          if ($leftover.Count -gt 0) { throw "语法检查不应留下字节码：$($leftover[0].FullName)" }

      - name: JSON 可解析
        shell: pwsh
        run: |
          python -c "import json,io; [json.load(io.open(p, encoding='utf-8')) for p in ('package.json','config.example.json')]; print('json ok')"

      - name: PowerShell 语法（setup.ps1 / download_models 包装）
        shell: pwsh
        run: |
          $target = Resolve-Path scripts/setup.ps1
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($target, [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) { Write-Host ("::error file=scripts/setup.ps1,line={0}::{1}" -f $e.Extent.StartLineNumber, $e.Message) }
            exit 1
          }
          "setup.ps1 parses"

      - name: 不含个人路径 / 密钥痕迹 / 打包垃圾
        shell: pwsh
        run: |
          # 这个项目是从一台私人机器上长出来的，最容易泄露的是写死的绝对路径而不是密钥。
          # 注意：本文件里就写着这些模式，所以要排除它自己，否则自己会命中自己。
          # 分隔符要允许 1~2 个：源码里可能被转义成双反斜杠（"D:\\vector-memory-data"），只写一个会漏。
          $pattern = 'DSH_Space|train-venv|mega_rag|dsh-vec(?![-\w])|dsh-plugins|Users[\\/]{1,2}Administrator|[A-Za-z]:[\\/]{1,2}dsh-|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{24,}'
          $self = '.github/workflows/ci.yml'
          $binary = '\.(png|jpg|jpeg|gif|webp|ico|pdf|zip|gz|zst|zstd|npz|npy|bin|exe|dll|pyc|woff2?|ttf|mp4|webm)$'
          $files = @(@(git ls-files) + @(git ls-files --others --exclude-standard))
          $files = $files | Where-Object { $_ -and $_ -ne $self } | Sort-Object -Unique
          $hits = @()
          foreach ($f in $files) {
            if ($f -match $binary) { continue }
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { continue }
            $text = Get-Content -LiteralPath $f -Raw -ErrorAction SilentlyContinue
            if ($null -eq $text) { continue }
            $lineNo = 0
            foreach ($line in ($text -split "`r?`n")) {
              $lineNo++
              if ($line -match $pattern) { $hits += ("{0}:{1}: {2}" -f $f, $lineNo, $line.Trim()) }
            }
          }
          if ($hits.Count -gt 0) {
            foreach ($h in $hits) { Write-Host ("::error::疑似个人痕迹或密钥：{0}" -f $h) }
            throw "发现疑似个人路径/密钥痕迹，请改成占位符"
          }
          "no personal paths or key patterns ($($files.Count) files)"

          # 打包垃圾：__pycache__ / *.pyc 会随发布包泄出本机字节码（里面带着绝对路径）
          $junk = @()
          $junk += @(Get-ChildItem -Recurse -Force -File -Include *.pyc,*.pyo -ErrorAction SilentlyContinue)
          $junk += @(Get-ChildItem -Recurse -Force -Directory -Filter __pycache__ -ErrorAction SilentlyContinue)
          $junk = @($junk | Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' })
          if ($junk.Count -gt 0) {
            foreach ($j in $junk) { Write-Host ("::error::打包垃圾：{0}" -f $j.FullName) }
            throw "仓库里不该有 __pycache__ / *.pyc"
          }
          "no build artifacts"
